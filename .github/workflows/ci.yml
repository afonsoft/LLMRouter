name: CI

on:
  push:
    branches: [main, devin/*]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/tests.trx"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (smoke, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: llmrouter:ci
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish server
        run: dotnet publish src/LLMRouter.Server -c Release -o publish
      - name: Start server
        run: |
          cd publish && ASPNETCORE_URLS=http://localhost:20128 nohup dotnet LLMRouter.Server.dll > $RUNNER_TEMP/server.log 2>&1 &
          echo $! > $RUNNER_TEMP/server.pid
          for i in $(seq 1 60); do curl -sf http://localhost:20128/api/version && break || sleep 2; done
      - name: Playwright smoke
        run: |
          cd e2e
          npm ci --no-audit --no-fund || npm i --no-audit --no-fund
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:20128 node smoke.mjs
      - name: Server log on failure
        if: failure()
        run: cat $RUNNER_TEMP/server.log || true

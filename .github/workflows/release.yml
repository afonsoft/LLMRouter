name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish single-file
        run: |
          dotnet publish src/LLMRouter.Server -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -o out/${{ matrix.rid }}
      - name: Package
        run: |
          cd out/${{ matrix.rid }}
          case "${{ matrix.rid }}" in
            win-*) zip -q ../../llmrouter-${{ matrix.rid }}.zip * ;;
            *) tar -czf ../../llmrouter-${{ matrix.rid }}.tar.gz * ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: llmrouter-${{ matrix.rid }}
          path: out/llmrouter-*
          if-no-files-found: error

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: llmrouter-*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/afonsoft/llmrouter:${{ github.ref_name }},ghcr.io/afonsoft/llmrouter:latest
